name: Test Suite & PostgreSQL Behavioral Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: atlob_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint (TypeScript type-check)
        run: npm run lint

      - name: Create the restricted role in the disposable test service
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -X -v ON_ERROR_STOP=1 -U postgres -d postgres <<'SQL'
          CREATE ROLE contabilidad_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
          ALTER DATABASE atlob_test OWNER TO contabilidad_app;
          SQL

      - name: Run behavioral PostgreSQL RLS test
        env:
          TEST_DATABASE_URL: postgresql://contabilidad_app@127.0.0.1:5432/atlob_test
        run: npm run test:pg

      - name: Run complete unit and integration tests
        run: npm test
