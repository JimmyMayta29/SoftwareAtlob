name: Test Suite & PostgreSQL Behavioral Verification

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run behavioral PostgreSQL RLS test
        run: node --import tsx server/tests/real/test_pg_docker.ts

      - name: Run complete unit and integration tests
        run: npm test
