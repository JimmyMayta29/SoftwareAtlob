<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlob Consultores ERP · Barra superior</title>
<style>
:root{--bg:#f1f5f9;--bar:#ffffff;--line:#cbd5e1;--ink:#0f172a;--mut:#64748b;--hov:#dbeafe;--acc:#1d4ed8;--deep:#0f172a;--pop:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--bar:#1e293b;--line:#334155;--ink:#e2e8f0;--mut:#94a3b8;--hov:#1e3a8a;--acc:#93c5fd;--deep:#020617;--pop:#1e293b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--bar:#1e293b;--line:#334155;--ink:#e2e8f0;--mut:#94a3b8;--hov:#1e3a8a;--acc:#93c5fd;--deep:#020617;--pop:#1e293b;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--deep);color:var(--ink);font:13px/1.2 "Segoe UI",system-ui,-apple-system,Arial,sans-serif;display:flex;flex-direction:column;min-height:100vh}
.title{background:var(--bar);border-bottom:1px solid var(--line);display:flex;gap:24px;align-items:center;padding:5px 12px;font-size:12.5px;flex-wrap:wrap}
.title b{font-weight:600}.title .logo{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;background:var(--acc);color:#fff;font-weight:700;font-size:12px;margin-right:6px}
.title span.k{color:var(--mut)}.title .sp{margin-left:auto;color:var(--mut)}
.menubar{background:var(--bar);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;padding:0 4px;position:relative;z-index:5}
.mi{position:relative}
.mi>button{all:unset;cursor:default;padding:6px 10px;font-size:13px;white-space:nowrap}
.mi.open>button,.mi>button:hover{background:var(--hov)}
.dd{display:none;position:absolute;top:100%;left:0;min-width:230px;background:var(--pop);border:1px solid var(--line);box-shadow:0 6px 16px rgba(0,0,0,.25);padding:2px 0;z-index:10}
.mi.open>.dd{display:block}
.it{position:relative;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:5px 12px 5px 22px;cursor:default;white-space:nowrap}
.it:hover,.it.sub-open{background:var(--hov)}
.it .sc{color:var(--mut);font-size:11px;margin-left:12px}
.it.has::after{content:"›";font-size:15px;color:var(--mut);margin-left:auto}
.it.has .sc{display:none}
.it>.dd{top:-3px;left:100%}
.it.sub-open>.dd{display:block}
.sep{height:1px;background:var(--line);margin:3px 0}
.tool{background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:2px;padding:4px 8px;flex-wrap:wrap}
.tb{all:unset;width:34px;height:30px;display:grid;place-items:center;border:1px solid transparent;border-radius:3px;color:var(--ink);cursor:default}
.tb:hover{background:var(--hov);border-color:var(--line)}
.tb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tsep{width:1px;height:22px;background:var(--line);margin:0 6px}
.user{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;padding-right:6px}
.user select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:3px;padding:3px 6px;font:inherit}
.pill{background:var(--acc);color:#fff;border-radius:10px;padding:2px 8px;font-size:11px}
@media (prefers-color-scheme:dark){.pill{color:#0f172a}}
.work{flex:1;display:grid;place-items:center;color:#94a3b8;text-align:center;padding:24px}
.work h1{font-size:15px;font-weight:600;margin:0 0 6px;color:#e2e8f0}.work p{margin:0;font-size:12.5px}
.status{background:var(--bar);border-top:1px solid var(--line);display:flex;gap:16px;padding:4px 12px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.status b{color:var(--ink);font-weight:600}.status .sp{margin-left:auto}
</style>
</head>
<body>
<div class="title">
  <span><span class="logo">A</span><b>Atlob Consultores ERP</b> - Gestión Contable</span>
  <span><span class="k">Empresa:</span> <b>CA 2020</b></span>
  <span><span class="k">Período:</span> <b>ENERO 2026</b></span>
  <span class="sp">Desarrollado por Jimmy Mayta</span>
</div>
<nav class="menubar" id="menubar" aria-label="Menú principal"></nav>
<div class="tool" id="tool"></div>
<main class="work"><div><h1>Área de trabajo</h1><p>Elige una opción del menú superior. Los módulos se abren aquí, sin barra lateral.</p></div></main>
<div class="status"><span>Última acción: <b id="last">—</b></span><span class="sp">Atlob Consultores · Desarrollado por Jimmy Mayta</span></div>

<script>
// Estructura del menú: [etiqueta, atajo|submenú]. "-" = separador.
const M=[
["Contabilidad",[
 ["Plan de cuentas (PCGE)"],["Registro de asientos","F2"],
 ["Libros auxiliares",[["Libro diario"],["Libro mayor"],["Caja y bancos"]]],
 "-",["Registro de compras"],["Registro de ventas"],["Centro de costos"],"-",
 ["Ajustes y cierre",[["Diferencia de cambio"],["Depreciación"],["Cierre mensual"],["Cierre anual"]]]
]],
["Informes Contables",[["Balance de comprobación"],["Balance general"],["Estado de resultados"],["Análisis de cuenta"],["Flujo de efectivo"]]],
["Reportes SUNAT",[
 ["Libros",[["Diario"],["Mayor"],["Compras"],["Ventas"],["Caja y bancos"],["Inventarios y balances"]]],
 ["PDB",[["PDB Renta anual"],["PDB IGV-Renta mensual"]]],
 ["DAOT",[["Generar DAOT"],["Validar DAOT"]]],
 ["PDT",[["PDT 621 IGV-Renta"],["PDT 601 PLAME"],["PDT 617 Exportadores"]]],
 ["Libros Electrónicos"],["TXT valida compras SUNAT"]
]],
["SIRE SUNAT +",[["Importar propuesta compras (TXT/ZIP)"],["Importar propuesta ventas"],["Conciliador SIRE vs registro"],["Exportar TXT de ajustes"]]],
["Facturación",[
 ["Emitir factura / boleta","F3"],["Notas de crédito y débito"],["Guías de remisión (GRE)"],["Comunicación de baja"],"-",
 ["Lector XML UBL / CDR"],["Consulta de comprobantes"]
]],
["Créditos y Cobranza",[["Cuentas por cobrar"],["Cuentas por pagar"],["Letras y pagarés"],["Vencimientos SUNAT"]]],
["Tesorería",[["Conciliación bancaria"],["Movimientos bancarios"],["Flujo de caja proyectado"]]],
["Caja Chica",[["Apertura / cierre de caja"],["Registro de gastos"],["Reposición"]]],
["Gestión de Negocio",[["Cartera de empresas"],["Dashboard gerencial"],["Control de calidad / satisfacción"],["Biblioteca de documentos"]]],
["Empresa",[
 ["Nueva empresa"],["Buscar empresa","Ctrl+K"],["Configurar empresa"],"-",["Importar CSV"],
 ["Cambiar empresa activa"],["Cambiar período"]
]],
["Tablas",[["Clientes y proveedores"],["Tipos de comprobante"],["Tipo de cambio"],["Bancos"],["Unidades de medida"]]],
["Utilitarios",[
 ["Respaldos"],["Restaurar demo"],"-",["Usuarios y roles"],["Auditoría del sistema"],["Formato de reporte",[["Estándar (monocromo)"],["Corporativo (color)"]]]
]],
["Ayuda",[["Acerca de Atlob Consultores ERP"],["Desarrollado por Jimmy Mayta"]]]
];

const bar=document.getElementById('menubar'),last=document.getElementById('last');
const say=t=>last.textContent=t;
function build(items,path){
  const dd=document.createElement('div');dd.className='dd';
  items.forEach(x=>{
    if(x==="-"){const s=document.createElement('div');s.className='sep';dd.appendChild(s);return}
    const it=document.createElement('div');it.className='it';it.setAttribute('role','menuitem');
    const lab=document.createElement('span');lab.textContent=x[0];it.appendChild(lab);
    if(Array.isArray(x[1])){
      it.classList.add('has');it.appendChild(build(x[1],path+' › '+x[0]));
      it.addEventListener('mouseenter',()=>{[...it.parentNode.children].forEach(c=>c.classList.remove('sub-open'));it.classList.add('sub-open')});
    }else{
      if(x[1]){const k=document.createElement('span');k.className='sc';k.textContent=x[1];it.appendChild(k)}
      it.addEventListener('mouseenter',()=>[...it.parentNode.children].forEach(c=>c.classList.remove('sub-open')));
      it.addEventListener('click',e=>{e.stopPropagation();say(path+' › '+x[0]);closeAll()});
    }
    dd.appendChild(it);
  });
  return dd;
}
function closeAll(){document.querySelectorAll('.mi.open').forEach(m=>m.classList.remove('open'));document.querySelectorAll('.sub-open').forEach(m=>m.classList.remove('sub-open'))}
M.forEach(([name,items])=>{
  const mi=document.createElement('div');mi.className='mi';
  const b=document.createElement('button');b.textContent=name;b.setAttribute('aria-haspopup','true');
  mi.appendChild(b);mi.appendChild(build(items,name));bar.appendChild(mi);
  b.addEventListener('click',e=>{e.stopPropagation();const o=mi.classList.contains('open');closeAll();if(!o)mi.classList.add('open')});
  mi.addEventListener('mouseenter',()=>{if(document.querySelector('.mi.open')&&!mi.classList.contains('open')){closeAll();mi.classList.add('open')}});
});
document.addEventListener('click',closeAll);
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeAll();
  if(e.ctrlKey&&e.key.toLowerCase()==='k'){e.preventDefault();say('Empresa › Buscar empresa (Ctrl+K)')}
});

// Barra de herramientas (acciones globales de un clic)
const I={
 diario:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
 calc:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/>',
 print:'<path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="7"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>',
 import:'<path d="M12 3v12m0 0-4-4m4 4 4-4M4 20h16"/>',
 backup:'<path d="M17 18a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 6 18z"/><path d="M12 11v5m0 0-2-2m2 2 2-2"/>',
 company:'<path d="M3 21h18M5 21V7l7-4 7 4v14M9 11h2m2 0h2M9 15h2m2 0h2"/>',
 sire:'<path d="M4 6h16M4 12h10M4 18h16"/><path d="m17 10 3 2-3 2"/>'
};
const T=[["diario","Registro de asientos"],["calc","Calculadora"],["print","Imprimir"],"|",
 ["search","Buscar empresa (Ctrl+K)"],["import","Importar CSV"],["backup","Respaldos"],"|",["company","Configurar empresa"],["sire","Conciliador SIRE"]];
const tool=document.getElementById('tool');
T.forEach(t=>{
  if(t==="|"){const s=document.createElement('span');s.className='tsep';tool.appendChild(s);return}
  const b=document.createElement('button');b.className='tb';b.title=t[1];b.setAttribute('aria-label',t[1]);
  b.innerHTML='<svg viewBox="0 0 24 24">'+I[t[0]]+'</svg>';b.onclick=()=>say('Barra › '+t[1]);tool.appendChild(b);
});
const u=document.createElement('div');u.className='user';
u.innerHTML='<span class="pill">ADMIN_ESTUDIO</span><select aria-label="Perfil de prueba"><option>Jimmy Mayta (Administrador principal)</option><option>Contador</option><option>Auditor</option></select>';
tool.appendChild(u);
</script>
</body>
</html>
