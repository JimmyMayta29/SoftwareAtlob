services:
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ATLOB_TEST_ADMIN_PASSWORD:?Ejecute el lanzador de PostgreSQL de pruebas}
      POSTGRES_DB: atlob_test
      ATLOB_TEST_APP_PASSWORD: ${ATLOB_TEST_APP_PASSWORD:?Ejecute el lanzador de PostgreSQL de pruebas}
    ports:
      - "127.0.0.1::5432"
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./server/tests/real/postgres_test_init.sh:/docker-entrypoint-initdb.d/10-atlob.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "contabilidad_app", "-d", "atlob_test"]
      interval: 2s
      timeout: 5s
      retries: 15
